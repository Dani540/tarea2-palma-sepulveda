name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Ejecutar tests
        run: chmod +x mvnw && ./mvnw -B test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Generar JAR
        run: chmod +x mvnw && ./mvnw -B -DskipTests package

      - name: Guardar JAR
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/*.jar
          retention-days: 7

      - name: Construir imagen Docker
        run: |
          docker build \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            -t "tarea2:${GITHUB_SHA}" .

      - name: Exportar imagen para el job publish
        run: docker save "tarea2:${GITHUB_SHA}" | gzip > imagen.tar.gz

      - name: Guardar imagen
        uses: actions/upload-artifact@v4
        with:
          name: imagen
          path: imagen.tar.gz
          retention-days: 1

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Descargar imagen
        uses: actions/download-artifact@v4
        with:
          name: imagen

      - name: Cargar imagen
        run: gunzip -c imagen.tar.gz | docker load

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetar y publicar (latest y SHA corto)
        run: |
          IMAGEN="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHA_CORTO="${GITHUB_SHA::7}"
          docker tag "tarea2:${GITHUB_SHA}" "${IMAGEN}:latest"
          docker tag "tarea2:${GITHUB_SHA}" "${IMAGEN}:${SHA_CORTO}"
          docker push "${IMAGEN}:latest"
          docker push "${IMAGEN}:${SHA_CORTO}"

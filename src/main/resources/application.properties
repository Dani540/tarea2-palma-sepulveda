spring.application.name=tarea2

# Puerto HTTP. Variable de entorno APP_PORT; por defecto, 3001.
server.port=${APP_PORT:3001}

# Ruta del archivo de compras. Variable de entorno CSV_PATH; por defecto, compras.csv en el directorio de trabajo.
compras.csv-path=${CSV_PATH:compras.csv}

# URLs base de las fuentes de indicadores, separadas por coma y en orden de preferencia.
# Variable de entorno INDICADORES_URLS. findic.cl expone la misma API que mindicador.cl y se consulta si esta falla.
indicadores.urls=${INDICADORES_URLS:https://mindicador.cl/api,https://findic.cl/api}
